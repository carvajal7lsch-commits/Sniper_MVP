# Para Dokploy (servicio tipo Compose). En Dokploy, la ruta del compose es ./docker/docker-compose.yml.
# El dominio se agrega desde la UI de Dokploy apuntando al servicio `web`, puerto 80.
# Sin container_name para no chocar con otros stacks.
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - '80'
