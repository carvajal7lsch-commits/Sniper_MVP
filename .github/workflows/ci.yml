# Verificación en cada push y pull request: tipos, pruebas, formato, build y presupuesto de peso.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run format:check
      # Sin public/media en el repo las imágenes no cuentan; el presupuesto vigila HTML, CSS, JS y fuente.
      - run: npm run build
